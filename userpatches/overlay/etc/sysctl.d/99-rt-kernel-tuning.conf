# RT kernel tuning: CPU scheduling, memory, network, IPC
# Optimizations for RK3588s real-time kernel with isolated RT cores (6,7)
# WARNING: Parameters tuned specifically for 2 RT cores + 6 system cores

# ============= CPU Scheduling =============
# RT task time budget (80% CPU for RT, 20% for background/system)
# Conservative: 950000 was too aggressive for mixed 8-core ARM SoC
kernel.sched_rt_runtime_us=800000
kernel.sched_rt_period_us=1000000

# ============= Memory Management =============
# Disable transparent hugepages - causes unpredictable latency spikes
vm.nr_hugepages=0

# Reduce swap tendency - RT tasks must stay in memory
vm.swappiness=10

# Increase max memory map count for applications (ROS2, OpenCV, etc.)
vm.max_map_count=262144

# Memory protection: prevent null pointer dereference exploits
vm.mmap_min_addr=32768

# ============= Network Tuning =============
# Fair queuing with congestion detection for low-latency networking
net.core.default_qdisc=fq_codel

# Reduce network buffer sizes for embedded system (RK3588s)
# Original 256MB was excessive; reduced to 128MB to preserve RAM
net.core.rmem_max=134217728
net.core.wmem_max=134217728
net.ipv4.tcp_rmem=4096 87380 134217728
net.ipv4.tcp_wmem=4096 65536 134217728

# ============= IPC Tuning (ROS2 middleware) =============
# POSIX message queue limits - reduced to reasonable size
# 16KB messages instead of 65KB to reduce memory overhead
kernel.msgmax=16384
kernel.msgmnb=16384
kernel.msgmni=1024

# ============= Security & System =============
# IMPORTANT: Disable sysrq for production robot systems
# Enables: Ctrl+Alt+SysRq key commands could interrupt critical operations
kernel.sysrq=0

# ============= Other RT Optimizations =============
# Reduce timer resolution for better precision
kernel.timer_migration=0

# Reduce noisy neighbor effects by disabling debug features
kernel.kptr_restrict=1
