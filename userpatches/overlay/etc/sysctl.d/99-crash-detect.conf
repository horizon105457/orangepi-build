# Crash detection & auto-recovery for real-time robot onboard image
# Mirrors rpicm5-auto-deploy module 06 (crash detection set)
# Policy: all fatal kernel conditions panic -> reboot after 10s (no hangs).
# panic_on_warn=0: a kernel WARN alone must NOT reboot an airborne/legged robot.
kernel.panic=10
kernel.panic_on_oops=1
kernel.softlockup_panic=1
kernel.hardlockup_panic=1
kernel.hung_task_panic=1
kernel.hung_task_timeout_secs=120
kernel.rcu_cpu_stall_timeout=30
kernel.panic_on_warn=0
