# Hardware watchdog — systemd PID1 feeds /dev/watchdog (RK3588 dw_wdt)
# Robot crash-recovery chain: panic=10s (software) -> watchdog (hardware)
# RuntimeWatchdogSec: systemd pings the watchdog every 30s; if PID1 hangs
# (hard lockup, NMI stall), the SoC watchdog resets the board.
[Manager]
RuntimeWatchdogSec=30
RebootWatchdogSec=5min
