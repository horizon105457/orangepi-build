#!/bin/bash
#
# 6.1-rt kernel build config — CM5-CC
# Build: sudo ./build.sh 61-rt BUILD_OPT=kernel
#
# Purpose:
#   PREEMPT_RT on kernel 6.1.y (orange-pi-6.1-rk35xx-rt).
#   Stable base for real-time validation.
#
build_rt_image="yes"                    # Enable PREEMPT_RT branch
BRANCH="current"                        # → orange-pi-6.1-rk35xx-rt
BOARD="orangepicm5-cc"                  # Target board
RELEASE="noble"                         # Ubuntu 24.04
KERNELSOURCE="https://github.com/horizon105457/linux-orangepi.git"

# Build options
KERNEL_CONFIGURE="no"
CLEAN_LEVEL="debs,oldcache"
DEST_LANG="en_US.UTF-8"

# Advanced
EXTERNAL_NEW="prebuilt"
INSTALL_HEADERS=""
LIB_TAG="master"
USE_TORRENT="yes"
DOWNLOAD_MIRROR="china"

BUILD_DESKTOP="yes"
KERNEL_ONLY="no"
BUILD_KSRC="no"
INSTALL_KSRC="no"
IGNORE_UPDATES=""
COMPRESS_OUTPUTIMAGE="yes"
NO_APT_CACHER="yes"

DESKTOP_ENVIRONMENT="xfce"
DESKTOP_ENVIRONMENT_CONFIG_NAME="config_base"
DESKTOP_APPGROUPS_SELECTED=""

# Real-time robot onboard image (mirrors rpicm5-auto-deploy module 05 package set)
PACKAGE_LIST_ADDITIONAL="avahi-daemon libnss-mdns avahi-utils python3-pip python3-venv curl gnupg lsb-release \
    rt-tests stress-ng htop iotop chrony systemd-coredump linuxptp \
    cmake build-essential git vim jq iperf3 mtr tcpdump nmap \
    docker.io docker-compose-v2 \
    libcamera0.2 libcamera-apps libcamera-tools"

# Overlay
OVERLAY_MERGE="partial"

# Robot payload install policy (system-level)
# INSTALL_ROS2_SYSTEM=yes  -> 系统级安装 ROS2 Jazzy (base + extras, 体积 ~2GB)
# INSTALL_ROS2_SYSTEM=no   -> 纯容器化: ROS2 载荷全部由 /opt/robot-stack 容器承担
#                             (容器 ros:jazzy-ros-base 自包含, 不耦合宿主)
# INSTALL_OPENCV_SYSTEM=yes -> 系统级安装 OpenCV (体积 ~1GB)
# INSTALL_OPENCV_SYSTEM=no  -> 仅 vio 容器内安装 (libopencv-dev 供 OpenVINS 编译)
# 说明: libcamera 必须系统级 (设备管线/rkisp IPA); 载荷策略见
#       docs/61-rt-robot-image-spec.md 第 4 节。
INSTALL_ROS2_SYSTEM="no"
INSTALL_OPENCV_SYSTEM="no"

HOST="opibot-exp01"
OPI_USERNAME="horizon"
# 默认用户密码不入库（自定义配置）：构建时 export OPI_PWD='<secret>' 传入；
# 未设置时用 Armbian 默认，首次登录请立即修改（或由 customize-image 强制改密）。
MAINTAINER="horizon105457"
MAINTAINERMAIL="horizon105457@foxmail.com"
